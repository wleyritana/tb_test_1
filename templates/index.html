<!doctype html><html><body><h2>Document Intelligence Analyzer V1.3</h2><form id=f><input type=file id=files name=files multiple accept=.pdf><button>Upload & Analyze</button></form><div id=s></div><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();let fd=new FormData();for(const x of files.files)fd.append('files',x);let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json();let a=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:j.job_id,files:j.files})});let aj=await a.json();document.getElementById('s').innerHTML='<pre>'+JSON.stringify(aj,null,2)+'</pre>';}</script></body></html>
